# omp-live on Fly.io: https://ompi.fly.dev
# Everything is served from one address (/wiki/, /graph/, /search/, /agent/, /trace, /mcp).
# The machine sleeps when idle and wakes on the next request; a woken machine starts
# from the image, so the demo resets to its clean state.
app = "ompi"
primary_region = "sjc"

[env]
  OMP_HOST = "0.0.0.0"

[[vm]]
  size = "performance-2x"
  memory = "4096mb"

[http_service]
  internal_port = 8700
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
